# Per-repo values for the shared ../devtools scripts (see
# ../devtools/templates/devtools.conf.sample for every key).
REPO_NAME=smbanything
CI_ENV_PREFIX=SMBANYTHING
# Extra doctor probes, spliced into the remote doctor shell line (single-quoted
# so nothing expands locally when this file is sourced).
UNIXCI_DOCTOR_CMD='if [ "$(uname -s)" = Darwin ]; then command -v mount_smbfs >/dev/null && echo "mount_smbfs: present" || echo "mount_smbfs: MISSING (the macOS smoke needs it)"; else command -v smbclient >/dev/null && echo "smbclient: present" || echo "smbclient: MISSING (the Linux smoke needs it)"; [ -c /dev/net/tun ] && echo "/dev/net/tun: present" || [ "$(uname -s)" = Darwin ] || echo "/dev/net/tun: MISSING"; fi; sudo -n true >/dev/null 2>&1 && echo "passwordless sudo: available" || echo "passwordless sudo: MISSING (the packet-tunnel smoke needs it)"'
WINCI_STACK=rust
