[workspace]
members = ["crates/*"]
resolver = "3"

# One version for every crate: a release tags the workspace, so the core
# library an embedder pins by that tag carries the same number.
[workspace.package]
version = "0.0.11"
edition = "2024"

# Dependencies more than one crate uses, declared once.
[workspace.dependencies]
anyhow = "1"
bytes = "1"
libc = "0.2"
sha2 = "0.11"
smbanything_core = { path = "crates/smbanything_core" }
