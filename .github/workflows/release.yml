name: Release (Manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.new }}
      is_prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          if [ -z "$version" ]; then
            echo "::error::Could not parse version from Cargo.toml"
            exit 1
          fi
          tag="v$version"
          echo "new=$tag" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Abort if tag already exists
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.new }}" | grep -q .; then
            echo "::error::Tag ${{ steps.version.outputs.new }} already exists on remote"
            exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${{ steps.version.outputs.new }}" --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx true; then
            echo "Deleting stale draft release ${{ steps.version.outputs.new }}"
            gh release delete "${{ steps.version.outputs.new }}" --yes
          fi
          gh release create "${{ steps.version.outputs.new }}" \
            --draft \
            --target "${{ github.sha }}" \
            --title "Release ${{ steps.version.outputs.new }}" \
            --generate-notes \
            ${{ steps.version.outputs.prerelease == 'true' && '--prerelease' || '' }}

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned, not ubuntu-latest: the runner's glibc is the floor the .deb
          # declares (libc6 >= 2.39 in packaging/build-native-packages.sh), so it
          # must not drift under us into something newer.
          - runner: ubuntu-24.04
            label: linux-x86_64
          - runner: ubuntu-24.04-arm
            label: linux-arm64
          - runner: macos-latest
            label: macos-arm64
          # An MSI carrying smbanything.exe with the Wintun driver beside it.
          - runner: windows-latest
            label: windows-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install RPM packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Build release packages (${{ matrix.label }})
        if: runner.os != 'Windows'
        run: |
          bash packaging/build-tarball.sh
          bash packaging/build-native-packages.sh

      - name: Install WiX
        if: runner.os == 'Windows'
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build the release installer (${{ matrix.label }})
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File packaging/build-windows-msi.ps1

      - name: Install, run and remove the installer (${{ matrix.label }})
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File packaging/verify-windows-msi.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: smbanything-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  create-release:
    needs: [setup, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: smbanything-*
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Upload artifacts to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "${{ needs.setup.outputs.release_tag }}" \
            artifacts/*.deb artifacts/*.rpm artifacts/*.pkg \
            artifacts/*.tar.gz artifacts/*.msi --clobber

      - name: Publish release (remove draft, creates the tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ needs.setup.outputs.release_tag }}" --draft=false
